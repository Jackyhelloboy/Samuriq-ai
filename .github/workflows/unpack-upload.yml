name: Import uploaded Samuriq AI source

on:
  push:
    branches: [main]
    paths:
      - ".upload/**"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part-*.b64 | base64 --decode > /tmp/samuriq-ai.tar.xz
          mkdir -p /tmp/samuriq-source
          tar -xJf /tmp/samuriq-ai.tar.xz -C /tmp/samuriq-source
          test -d /tmp/samuriq-source/samuriq-ai
          cp -a /tmp/samuriq-source/samuriq-ai/. .
          rm -rf .upload .github/workflows/unpack-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Samuriq AI source project"
            git push
          fi
